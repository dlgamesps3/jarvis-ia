
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS | Stark Industries</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#02060c;
 color:#d8f7ff;
 font-family:Arial,sans-serif;
 min-height:100vh;
 overflow:hidden;
}

header{
 height:65px;
 padding:0 25px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #16718a55;
}

.logo{
 font-size:19px;
 letter-spacing:5px;
 color:#7beaff;
 text-shadow:0 0 15px #00bfff;
}

.status{
 font-size:10px;
 letter-spacing:3px;
 color:#55e9ff;
}

main{
 height:calc(100vh - 110px);
 display:flex;
 align-items:center;
 justify-content:center;
}

.interface{
 display:flex;
 flex-direction:column;
 align-items:center;
 width:100%;
 padding:15px;
}

.core{
 width:260px;
 height:260px;
 border-radius:50%;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 filter:drop-shadow(0 0 15px #00cfff66);
}

.ring{
 position:absolute;
 border-radius:50%;
 border:1px solid #20caff;
 box-shadow:0 0 12px #00bfff55;
}

.one{inset:0;border-style:dashed;animation:rotate 35s linear infinite}
.two{inset:18px;border-width:2px;border-left-color:transparent;border-right-color:transparent;animation:rotate 12s linear infinite reverse}
.three{inset:38px;border-style:dotted;animation:rotate 18s linear infinite}
.four{inset:57px;border-width:2px;border-top-color:transparent;border-bottom-color:transparent;animation:rotate 8s linear infinite reverse}

.center{
 width:105px;
 height:105px;
 border-radius:50%;
 background:radial-gradient(circle,#167e9c55,#03111d 70%);
 border:1px solid #55dfff;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 box-shadow:0 0 30px #00cfff66,inset 0 0 25px #00bfff44;
}

.center strong{
 font-size:21px;
 letter-spacing:2px;
 color:#a4f2ff;
 text-shadow:0 0 15px #00cfff;
}

.center small{
 font-size:8px;
 letter-spacing:3px;
 margin-top:7px;
}

@keyframes rotate{to{transform:rotate(360deg)}}

h2{
 margin-top:25px;
 font-size:11px;
 letter-spacing:5px;
 font-weight:400;
 color:#7deaff;
}

#response{
 margin-top:15px;
 font-size:13px;
 color:#b4dce8;
 text-align:center;
 max-width:330px;
 min-height:35px;
 line-height:1.6;
}

.controls{
 display:flex;
 gap:10px;
 align-items:center;
 margin-top:20px;
 width:min(420px,100%);
}

#message{
 flex:1;
 min-width:0;
 height:46px;
 border:1px solid #16718a;
 border-radius:25px;
 background:#061522;
 color:#d8f7ff;
 padding:0 17px;
 outline:none;
}

#message:focus{border-color:#42dfff}

button{
 cursor:pointer;
 color:#8deeff;
 background:#061b2b;
 border:1px solid #28c9ef;
 box-shadow:0 0 15px #00bfff33;
}

#send{
 height:46px;
 padding:0 18px;
 border-radius:25px;
}

#mic{
 margin-top:20px;
 width:58px;
 height:58px;
 border-radius:50%;
 font-size:23px;
}

button:hover{
 background:#0b3b50;
 box-shadow:0 0 25px #00cfff88;
}

.active{
 animation:pulse 1s infinite alternate;
}

@keyframes pulse{
 to{transform:scale(1.1);box-shadow:0 0 35px #00cfff}
}

footer{
 height:45px;
 border-top:1px solid #16718a55;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:9px;
 letter-spacing:3px;
 color:#327c91;
}

@media(max-width:400px){
 .core{width:230px;height:230px}
 .controls{gap:6px}
 #send{padding:0 12px}
}
</style>
</head>

<body>

<header>
 <div class="logo">J.A.R.V.I.S</div>
 <div class="status">● ONLINE</div>
</header>

<main>
 <div class="interface">

  <div class="core">
   <div class="ring one"></div>
   <div class="ring two"></div>
   <div class="ring three"></div>
   <div class="ring four"></div>

   <div class="center">
    <strong>J.A.R.V.I.S</strong>
    <small>STARK AI</small>
   </div>
  </div>

  <h2>ASSISTENTE PESSOAL</h2>

  <div id="response">
   Aguardando suas instruções, senhor.
  </div>

  <div class="controls">
   <input id="message" placeholder="Fale com o JARVIS..." autocomplete="off">
   <button id="send" onclick="sendMessage()">Enviar</button>
  </div>

  <button id="mic" onclick="startListening()">🎙</button>

  <div style="margin-top:12px;font-size:9px;letter-spacing:2px;color:#398ba2">
   VOZ E INTELIGÊNCIA ARTIFICIAL
  </div>

 </div>
</main>

<footer>
 STARK INDUSTRIES · JARVIS SYSTEM
</footer>

<script>
const API = "https://jarvis-api.dlzinaraujo24.workers.dev/";

const response = document.getElementById("response");
const message = document.getElementById("message");
const mic = document.getElementById("mic");

let history = [];
let busy = false;

function speak(text){
 speechSynthesis.cancel();

 const voice = new SpeechSynthesisUtterance(text);
 voice.lang = "pt-BR";
 voice.rate = 1;
 voice.pitch = 0.9;

 speechSynthesis.speak(voice);
}

async function sendMessage(text){
 text = (text || message.value).trim();

 if(!text || busy) return;

 busy = true;
 message.value = "";
 response.textContent = "Processando sua solicitação, senhor...";

 try{
  const res = await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    history:history
   })
  });

  const data = await res.json();

  if(!res.ok || !data.ok){
   throw new Error(data.error || "Falha na comunicação.");
  }

  const answer = data.reply;

  history.push(
   {role:"user",content:text},
   {role:"assistant",content:answer}
  );

  history = history.slice(-20);

  response.textContent = answer;
  speak(answer);

 }catch(error){
  response.textContent = "Falha de comunicação: " + error.message;
 }finally{
  busy = false;
 }
}

message.addEventListener("keydown",e=>{
 if(e.key==="Enter") sendMessage();
});

const SpeechRecognition =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

function startListening(){

 if(!SpeechRecognition){
  response.textContent = "Seu navegador não suporta reconhecimento de voz.";
  return;
 }

 const recognition = new SpeechRecognition();

 recognition.lang = "pt-BR";
 recognition.continuous = false;
 recognition.interimResults = false;

 recognition.onstart = ()=>{
  mic.classList.add("active");
  response.textContent = "Estou ouvindo, senhor...";
 };

 recognition.onresult = event=>{
  const text = event.results[0][0].transcript;
  sendMessage(text);
 };

 recognition.onerror = ()=>{
  response.textContent = "Não consegui ouvir. Tente novamente.";
 };

 recognition.onend = ()=>{
  mic.classList.remove("active");
 };

 recognition.start();
}
</script>

</body>
</html>
